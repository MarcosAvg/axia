name: Reporte de error
description: Informa un comportamiento incorrecto
title: '[Error]: '
labels: ['bug']
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué ocurre y qué se esperaba.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Desarrollo local
        - Autoalojado
        - Supabase Cloud
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: '0.0.0 o el hash del commit'
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Evidencias
      description: Registros, capturas o mensajes de error. No incluir secretos.
    validations:
      required: false
