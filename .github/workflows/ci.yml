name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: axia_test
          POSTGRES_USER: axia_owner
          POSTGRES_PASSWORD: owner-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axia_owner -d axia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://axia_owner:owner-test@127.0.0.1:5432/axia_test
      AXIA_APP_PASSWORD: test-app-password
      DATABASE_URL: postgres://axia_app:test-app-password@127.0.0.1:5432/axia_test
      AXIA_DEMO_PASSWORD: E2ePassword123!
      PORT: 3100
      AXIA_API_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axia/web exec playwright install chromium --with-deps
      # La compuerta completa se ejecuta una vez por PR o push a main. El ciclo local usa
      # `pnpm check:fast` y `pnpm test:affected`.
      - run: pnpm check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_OWNER_PASSWORD: compose-test
      AXIA_APP_PASSWORD: compose-test
    steps:
      - uses: actions/checkout@v4
      - name: Validar Compose
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.dev.yaml config -q
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: app
          push: false
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
