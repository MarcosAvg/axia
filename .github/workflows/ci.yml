name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Levanta Supabase local con la CLI fijada en el repositorio; `pnpm check`
      # incluye la prueba pgTAP (`db:test`).
      - run: pnpm db:start
      # Deja apps/web/.env.local listo para el build y para Playwright.
      - run: pnpm env:local
      # Navegador para la prueba de humo de Playwright (incluida en `pnpm test`).
      - run: pnpm --filter @axia/web exec playwright install chromium --with-deps
      - run: pnpm check
