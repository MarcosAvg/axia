name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: axia_test
          POSTGRES_USER: axia_test_owner
          POSTGRES_PASSWORD: test-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axia_test_owner -d axia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AXIA_ENV_FILE: /dev/null
      MIGRATION_DATABASE_URL: postgres://axia_test_owner:test-owner-password@127.0.0.1:5432/axia_test
      AXIA_APP_PASSWORD: test-app-password
      DATABASE_URL: postgres://axia_app:test-app-password@127.0.0.1:5432/axia_test
      AXIA_DEMO_PASSWORD: E2ePassword123!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axia/web exec playwright install chromium --with-deps
      # La compuerta completa se ejecuta una vez por PR o push a main. El ciclo local usa
      # `pnpm check:fast` y `pnpm test:affected`.
      - run: pnpm check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AXIA_ENV_FILE: /dev/null
      AXIA_IMAGE: axia-app:ci
      POSTGRES_OWNER_PASSWORD: compose-test
      AXIA_APP_PASSWORD: compose-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar Compose
        run: |
          docker compose -f compose.yaml config -q
          docker compose --env-file /dev/null -f compose.dev.yaml config -q
          docker compose --env-file /dev/null -f compose.test.yaml config -q
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: app
          push: false
          load: true
          tags: |
            axia-app:ci
            axia-app:${{ github.sha }}
          build-args: |
            AXIA_VERSION=${{ github.sha }}
            AXIA_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
      - name: Instalación, actualización y recuperación reales
        run: bash scripts/docker-smoke.sh
      - name: Actualización desde un paquete publicado sin publicar la candidata
        if: github.ref_type != 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE: axia-app:${{ github.sha }}
        run: |
          origin="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | node scripts/release-channel.mjs latest-stable)"
          [[ -n "$origin" ]] || { echo 'Falta una release estable de origen.' >&2; exit 1; }
          bundle="$(mktemp -d)"
          gh release download "$origin" --repo "$GITHUB_REPOSITORY" --dir "$bundle" \
            --pattern axia-self-hosted.tar.gz --pattern axia-self-hosted.tar.gz.sha256
          bash scripts/docker-upgrade-smoke.sh "$bundle/axia-self-hosted.tar.gz" "$CANDIDATE"
