name: Publicar release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: identity
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ github.ref_type }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/$repo/axia-app"
          version="$GITHUB_SHA"
          tags="$image:$GITHUB_SHA"
          channel="$(node scripts/release-channel.mjs channel "$RELEASE_TYPE" "$RELEASE_REF")"
          if [[ "$channel" != commit ]]; then
            version="$RELEASE_REF"
            tags="$tags,$image:$version"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Proteger las versiones publicadas
        if: steps.identity.outputs.channel != 'commit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq "$RELEASE_VERSION" <<< "$published"; then
            echo 'La release ya existe. Para completar una promoción fallida, reintentar solo el trabajo de promoción.' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: app
          push: false
          load: true
          cache-from: type=gha
          tags: ${{ steps.identity.outputs.tags }}
          build-args: |
            AXIA_VERSION=${{ steps.identity.outputs.version }}
            AXIA_REVISION=${{ github.sha }}
      - name: Verificar la imagen exacta antes de publicarla
        env:
          AXIA_IMAGE: ${{ steps.identity.outputs.image }}:${{ github.sha }}
        run: bash scripts/docker-smoke.sh
      - id: upgrade
        name: Actualizar y recuperar desde la release estable anterior
        if: steps.identity.outputs.channel != 'commit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          CANDIDATE: ${{ steps.identity.outputs.image }}:${{ github.sha }}
        run: |
          bundle="$(mktemp -d)"
          origin="$(bash scripts/download-upgrade-origin.sh "$bundle" "$RELEASE_VERSION")"
          bash scripts/docker-upgrade-smoke.sh "$bundle/axia-self-hosted.tar.gz" "$CANDIDATE"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
      - id: publish
        name: Publicar el artefacto probado
        env:
          RELEASE_IMAGE: ${{ steps.identity.outputs.image }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          docker push "$RELEASE_IMAGE:$GITHUB_SHA"
          if [[ "$RELEASE_VERSION" != "$GITHUB_SHA" ]]; then
            docker push "$RELEASE_IMAGE:$RELEASE_VERSION"
          fi
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$RELEASE_IMAGE:$GITHUB_SHA")"
          [[ "$reference" == "$RELEASE_IMAGE@sha256:"* ]]
          echo "image=$reference" >> "$GITHUB_OUTPUT"
      - name: Empaquetar instalación sin herramientas de desarrollo
        env:
          RELEASE_IMAGE: ${{ steps.publish.outputs.image }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          node scripts/package-release.mjs .release/bundle "$RELEASE_IMAGE" "$GITHUB_SHA" "$RELEASE_VERSION"
          tar -C .release/bundle -czf .release/axia-self-hosted.tar.gz .
          cd .release
          sha256sum axia-self-hosted.tar.gz > axia-self-hosted.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: axia-self-hosted
          path: |
            .release/axia-self-hosted.tar.gz
            .release/axia-self-hosted.tar.gz.sha256
      - name: Adjuntar paquete a la release etiquetada
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.identity.outputs.channel }}
          RELEASE_ORIGIN: ${{ steps.upgrade.outputs.origin }}
        run: |
          flags=(--latest=false --verify-tag --generate-notes)
          if [[ "$RELEASE_CHANNEL" == prerelease ]]; then flags+=(--prerelease); fi
          flags+=(--notes "Probado en Linux amd64 con Docker Engine y Compose v2. Actualización y recuperación verificadas desde $RELEASE_ORIGIN. Antes de actualizar, revisa los cambios de configuración y reserva una ventana de mantenimiento.")
          gh release create "$RELEASE_VERSION" .release/axia-self-hosted.tar.gz .release/axia-self-hosted.tar.gz.sha256 "${flags[@]}"

  promote-stable:
    needs: publish
    if: needs.publish.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: axia-stable-channel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promover la mayor release estable con paquete verificable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ needs.publish.outputs.channel }}
        run: bash scripts/promote-stable.sh "$RELEASE_CHANNEL"
