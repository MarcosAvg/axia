name: axia-dev
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: axia_dev
      POSTGRES_USER: axia_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Configura .env.dev con scripts/install.sh}
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U axia_owner -d axia_dev']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dev_db_data:
