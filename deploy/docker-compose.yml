# Axia — app con Docker Compose.
#
# El backend Supabase se despliega aparte (Cloud o autoalojado); este archivo solo define el frontend
# y las migraciones.
#
# Procedimiento:
#   docker compose up -d              # levanta la web
#   docker compose run --rm migrate   # aplica las migraciones
#
# La web publica en `WEB_PORT` (por defecto 8080); el reverse proxy TLS apunta a ese puerto.
# Contrato de despliegue en `deploy/README.md`.

name: axia

services:
  web:
    image: ${AXIA_WEB_IMAGE:-axia-web:local}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    env_file: .env
    ports:
      - '${WEB_PORT:-8080}:80'
    restart: unless-stopped

  # Migraciones: `docker compose run --rm migrate` (no se levanta con `up`).
  migrate:
    image: ${AXIA_MIGRATE_IMAGE:-axia-migrate:local}
    build:
      context: ..
      dockerfile: deploy/migrate.Dockerfile
    env_file: .env
    profiles: ['migrate']
    restart: 'no'
