# Axia — ejemplo OPCIONAL con Traefik
#
# Traefik no sirve archivos estáticos: necesita algo que los sirva. Aquí usamos un nginx mínimo
# que monta `apps/web/dist`. La API (Kong) ya la expone el stack de Supabase; solo hay que enrutarla.
#
# Este archivo es un punto de partida, NO parte del stack de Axia. Ajusta dominios, red y TLS.
# Se conecta a la red del compose oficial de Supabase para alcanzar Kong por su nombre de servicio.

services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # TLS: añade un resolver ACME o usa tu terminación TLS existente.
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [supabase_default]

  web:
    image: nginx:alpine
    # Publica el build aquí antes: DEPLOY_TARGET=... ./deploy/scripts/publish-web.sh
    volumes:
      - /srv/axia/web:/usr/share/nginx/html:ro
      - ./nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.axia-web.rule=Host(`axia.tuinstitucion.mx`)
      - traefik.http.routers.axia-web.entrypoints=websecure
      - traefik.http.routers.axia-web.tls=true
      - traefik.http.services.axia-web.loadbalancer.server.port=80
    networks: [supabase_default]

  # La API: añade estas etiquetas al servicio `kong` del compose oficial (o define un router
  # apuntando a `kong:8000`). Referencia:
  #
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.axia-api.rule=Host(`api.axia.tuinstitucion.mx`)
  #     - traefik.http.routers.axia-api.entrypoints=websecure
  #     - traefik.http.routers.axia-api.tls=true
  #     - traefik.http.services.axia-api.loadbalancer.server.port=8000

networks:
  supabase_default:
    external: true
    # Nombre real de la red del compose oficial (ajústalo): `docker network ls`.
    name: docker_default

