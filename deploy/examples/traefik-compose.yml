# Axia — ejemplo opcional con Traefik
#
# Traefik no sirve archivos estáticos; requiere un servidor que los sirva. Este ejemplo usa un nginx
# mínimo que monta `apps/web/dist`. La API (Kong) ya la expone el stack de Supabase y solo requiere
# enrutarla.
#
# Es un punto de partida y no forma parte del stack de Axia. Los dominios, la red y TLS deben
# ajustarse a cada infraestructura. Se conecta a la red del compose oficial para alcanzar Kong por
# su nombre de servicio.

services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # TLS: añadir un resolver ACME o usar la terminación TLS existente.
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [supabase_default]

  web:
    image: nginx:alpine
    # Publicar el build antes: DEPLOY_TARGET=... ./deploy/scripts/publish-web.sh
    volumes:
      - /srv/axia/web:/usr/share/nginx/html:ro
      - ./nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.axia-web.rule=Host(`axia.tuinstitucion.mx`)
      - traefik.http.routers.axia-web.entrypoints=websecure
      - traefik.http.routers.axia-web.tls=true
      - traefik.http.services.axia-web.loadbalancer.server.port=80
    networks: [supabase_default]

  # La API: añadir estas etiquetas al servicio `kong` del compose oficial, o definir un router que
  # apunte a `kong:8000`. Referencia:
  #
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.axia-api.rule=Host(`api.axia.tuinstitucion.mx`)
  #     - traefik.http.routers.axia-api.entrypoints=websecure
  #     - traefik.http.routers.axia-api.tls=true
  #     - traefik.http.services.axia-api.loadbalancer.server.port=8000

networks:
  supabase_default:
    external: true
    # Nombre real de la red del compose oficial (ajustar): `docker network ls`.
    name: docker_default

