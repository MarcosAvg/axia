# Axia — ejemplo opcional con nginx

Adaptar los dominios y las rutas. Consta de dos bloques: la app (archivos estáticos) y la API (Kong).

```nginx
# --- App (estáticos de apps/web/dist) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name axia.tuinstitucion.mx;

    ssl_certificate     /etc/letsencrypt/live/axia.tuinstitucion.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axia.tuinstitucion.mx/privkey.pem;

    root /srv/axia/web;
    index index.html;

    # El service worker y el manifest no se cachean (evita versiones antiguas en los móviles).
    location = /config.js            { add_header Cache-Control "no-store"; }
    location = /sw.js                { add_header Cache-Control "no-cache"; }
    location = /registerSW.js        { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # SPA: si el archivo no existe, entrega el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- API (Kong del stack de Supabase) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.axia.tuinstitucion.mx;

    ssl_certificate     /etc/letsencrypt/live/api.axia.tuinstitucion.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.axia.tuinstitucion.mx/privkey.pem;

    # Evidencias: ajustar también en Kong y Storage si fuera necesario.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # WebSocket (Realtime) y cabeceras.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime mantiene conexiones largas.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
```

> **Nota:** si Kong no escucha en `127.0.0.1:8000`, ajustar `proxy_pass` según el puerto que publique
> el compose (`docker compose ps`). Para redirigir HTTP a HTTPS se añade un tercer bloque `server`
> con `listen 80` y `return 301 https://$host$request_uri;`.
