# Servidor de estáticos del contenedor `web` (SPA). No es un proxy de borde:
# el TLS y el dominio los pone tu reverse proxy, que apunta aquí.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # La configuración en runtime nunca se cachea (la genera el arranque del contenedor).
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # El service worker y el manifest tampoco, para que los móviles no queden con versiones viejas.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  # SPA: si el archivo no existe, entrega el index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
