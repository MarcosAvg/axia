name: axia

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axia}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-axia_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}
    volumes:
      - axia_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    image: ghcr.io/marcosavg/axia/axia-migrate:${AXIA_VERSION:-latest}
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_OWNER_USER:-axia_owner}:${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-axia}
      AXIA_APP_USER: ${AXIA_APP_USER:-axia_app}
      AXIA_APP_PASSWORD: ${AXIA_APP_PASSWORD:?set AXIA_APP_PASSWORD}
    restart: 'no'

  app:
    image: ghcr.io/marcosavg/axia/axia-app:${AXIA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-3100}:3100'
    networks:
      - default
      - proxy
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${AXIA_APP_USER:-axia_app}:${AXIA_APP_PASSWORD:?set AXIA_APP_PASSWORD}@db:5432/${POSTGRES_DB:-axia}
      HOST: 0.0.0.0
      PORT: 3100
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-1048576}
      HEALTH_TIMEOUT_MS: ${HEALTH_TIMEOUT_MS:-2000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      STATIC_DIR: /app/web
      STORAGE_DIR: /data/evidence
      EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-20971520}
      EVIDENCE_MAX_DIMENSION: ${EVIDENCE_MAX_DIMENSION:-4096}
      EVIDENCE_THUMBNAIL_SIZE: ${EVIDENCE_THUMBNAIL_SIZE:-320}
      EVIDENCE_QUOTA_BYTES: ${EVIDENCE_QUOTA_BYTES:-524288000}
      SSE_HEARTBEAT_MS: ${SSE_HEARTBEAT_MS:-15000}
      SYNC_FUTURE_TOLERANCE_MS: ${SYNC_FUTURE_TOLERANCE_MS:-300000}
      SYNC_MAX_AGE_MS: ${SYNC_MAX_AGE_MS:-2592000000}
    volumes:
      - axia_evidence:/data/evidence
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}

volumes:
  axia_db_data:
  axia_evidence:
