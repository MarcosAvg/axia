name: axia

x-image: &axia-image
  image: ${AXIA_IMAGE:-ghcr.io/marcosavg/axia/axia-app:latest}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - track_io_timing=on
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axia}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-axia_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}
    volumes:
      - axia_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  app:
    <<: *axia-image
    restart: unless-stopped
    networks:
      default:
      proxy:
        aliases:
          - ${AXIA_PROXY_ALIAS:-axia}
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        'sh',
        '-c',
        'node dist/db/migrate.js && unset MIGRATION_DATABASE_URL AXIA_APP_PASSWORD && exec node dist/server.js',
      ]
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_OWNER_USER:-axia_owner}:${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-axia}
      AXIA_APP_PASSWORD: ${AXIA_APP_PASSWORD:?set AXIA_APP_PASSWORD}
      DATABASE_URL: postgres://axia_app:${AXIA_APP_PASSWORD:?set AXIA_APP_PASSWORD}@db:5432/${POSTGRES_DB:-axia}
      HOST: 0.0.0.0
      PORT: 3100
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 'true'
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-1048576}
      HEALTH_TIMEOUT_MS: ${HEALTH_TIMEOUT_MS:-2000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      STATIC_DIR: /app/web
      STORAGE_DIR: /data/evidence
      EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-20971520}
      EVIDENCE_MAX_DIMENSION: ${EVIDENCE_MAX_DIMENSION:-4096}
      EVIDENCE_THUMBNAIL_SIZE: ${EVIDENCE_THUMBNAIL_SIZE:-320}
      EVIDENCE_QUOTA_BYTES: ${EVIDENCE_QUOTA_BYTES:-524288000}
      SSE_HEARTBEAT_MS: ${SSE_HEARTBEAT_MS:-15000}
      SYNC_FUTURE_TOLERANCE_MS: ${SYNC_FUTURE_TOLERANCE_MS:-300000}
      SYNC_MAX_AGE_MS: ${SYNC_MAX_AGE_MS:-2592000000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-axia_session}
      SESSION_ABSOLUTE_TTL_HOURS: ${SESSION_ABSOLUTE_TTL_HOURS:-168}
      SESSION_IDLE_TTL_HOURS: ${SESSION_IDLE_TTL_HOURS:-24}
      SESSION_TOUCH_INTERVAL_SECONDS: ${SESSION_TOUCH_INTERVAL_SECONDS:-60}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_MAX_IP_ATTEMPTS: ${LOGIN_MAX_IP_ATTEMPTS:-20}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      EVIDENCE_CLEANUP_HOURS: ${EVIDENCE_CLEANUP_HOURS:-24}
      RETENTION_SESSION_DAYS: ${RETENTION_SESSION_DAYS:-30}
      RETENTION_LOGIN_ATTEMPT_DAYS: ${RETENTION_LOGIN_ATTEMPT_DAYS:-90}
      RETENTION_NOTIFICATION_DAYS: ${RETENTION_NOTIFICATION_DAYS:-90}
    volumes:
      - axia_evidence:/data/evidence
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
    stop_grace_period: 15s

networks:
  proxy:
    name: ${AXIA_PROXY_NETWORK:-proxy}
    external: true

volumes:
  axia_db_data:
  axia_evidence:
